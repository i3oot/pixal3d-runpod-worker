name: Build Ampere Ada Hopper compatibility image

on:
  workflow_dispatch:
  push:
    branches: [cuda-ampere-hopper-20261027]
    paths:
      - tools/image_to_3d/runpod_service/Dockerfile.compat
      - tools/image_to_3d/runpod_service/check_cuda_arches.py
      - .github/workflows/compat.yml

permissions:
  contents: read
  packages: write

concurrency:
  group: cuda-compat-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: CPU contracts
        run: python3 -m unittest discover -s tools/image_to_3d/runpod_service -p 'test_*.py' -v
      - name: Make disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          df -h /
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build isolated compatibility tag
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: tools/image_to_3d/runpod_service/Dockerfile.compat
          platforms: linux/amd64
          push: true
          tags: ghcr.io/i3oot/pixal3d-runpod-worker:compat-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/i3oot/pixal3d-runpod-worker
            org.opencontainers.image.description=Pixal3D pinned runtime with Ampere Ada Hopper CUDA kernels
          cache-from: type=gha,scope=cuda-compat
          cache-to: type=gha,scope=cuda-compat,mode=min
